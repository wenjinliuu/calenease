name: CalenEase
options:
  bundleIdPrefix: com.wenjinliu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  fileTypes:
    "icon":
      file: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  CalenEase:
    type: application
    platform: iOS
    sources:
      - path: CalenEase
      # 放假安排快照：仓库根目录的 holidays/v1/ 原样打进包里（由 Update China holidays
      # 工作流维护），第一次打开没网也有数据。App 运行时再从腾讯云更新。
      - path: ../holidays
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.calenease
        # iCloud 备份要的 entitlements。容器标识符和 `ICloudBackupStore.containerID` 必须一字不差。
        CODE_SIGN_ENTITLEMENTS: CalenEase/Resources/CalenEase.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: CalenEase/Resources/Info.plist
      properties:
        CFBundleDisplayName: 省心日历
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 本机备份放在 Documents/Backups，在「文件」App 里看得见、拷得走。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # iCloud 云盘里显示成一个叫「省心日历」的文件夹，而不是一串容器标识符。
        NSUbiquitousContainers:
          iCloud.com.wenjinliu.calenease:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: 省心日历
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  CalenEaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CalenEaseTests
    dependencies:
      - target: CalenEase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.calenease.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO

  CalenEaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CalenEaseUITests
    dependencies:
      - target: CalenEase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.calenease.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: CalenEase

schemes:
  CalenEase:
    build:
      targets:
        CalenEase: all
        CalenEaseTests: [test]
    test:
      targets:
        - CalenEaseTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release

  # 截图专用：只跑 UI 测试，产物是 App Store 素材，不参与日常 CI
  CalenEaseScreenshots:
    build:
      targets:
        CalenEase: all
        CalenEaseUITests: [test]
    test:
      targets:
        - CalenEaseUITests
      gatherCoverageData: false
    run:
      config: Debug
