name: ShiftLedger
options:
  bundleIdPrefix: com.wenjinliu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  fileTypes:
    "icon":
      file: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ShiftLedger:
    type: application
    platform: iOS
    sources:
      - path: ShiftLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.shiftledger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: ShiftLedger/Resources/Info.plist
      properties:
        CFBundleDisplayName: 循环班表
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  ShiftLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ShiftLedgerTests
    dependencies:
      - target: ShiftLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.shiftledger.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO

  ShiftLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ShiftLedgerUITests
    dependencies:
      - target: ShiftLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.shiftledger.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: ShiftLedger

schemes:
  ShiftLedger:
    build:
      targets:
        ShiftLedger: all
        ShiftLedgerTests: [test]
    test:
      targets:
        - ShiftLedgerTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release

  # 截图专用：只跑 UI 测试，产物是 App Store 素材，不参与日常 CI
  ShiftLedgerScreenshots:
    build:
      targets:
        ShiftLedger: all
        ShiftLedgerUITests: [test]
    test:
      targets:
        - ShiftLedgerUITests
      gatherCoverageData: false
    run:
      config: Debug
