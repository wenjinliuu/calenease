name: CalenEase
options:
  bundleIdPrefix: com.wenjinliu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  fileTypes:
    "icon":
      file: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6

targets:
  CalenEase:
    type: application
    platform: iOS
    sources:
      - path: CalenEase
      # 放假安排快照：仓库根目录的 holidays/v1/ 原样打进包里（由 Update China holidays
      # 工作流维护），第一次打开没网也有数据。App 运行时再从腾讯云更新。
      - path: ../holidays
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.calenease
        # iCloud 备份要的 entitlements。容器标识符和 `ICloudBackupStore.containerID` 必须一字不差。
        CODE_SIGN_ENTITLEMENTS: CalenEase/Resources/CalenEase.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: CalenEase/Resources/Info.plist
      properties:
        CFBundleDisplayName: 省心日历
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 本机备份放在 Documents/Backups，在「文件」App 里看得见、拷得走。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # iCloud 云盘里显示成一个叫「省心日历」的文件夹，而不是一串容器标识符。
        NSUbiquitousContainers:
          iCloud.com.wenjinliu.calenease:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: 省心日历
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  CalenEaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CalenEaseTests
    dependencies:
      - target: CalenEase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.calenease.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO

  # 快照测试：固定日期 + 示例数据，逐像素对比 __Snapshots__ 里的参考图。参考图只在 CI 上录制。
  CalenEaseSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CalenEaseSnapshotTests
        excludes:
          - "**/__Snapshots__/**"
    dependencies:
      - target: CalenEase
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.calenease.snapshottests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO

  # 关键流程 + 无障碍审计：用 --demo-data 启动，不读写用户数据。
  CalenEaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CalenEaseUITests
    dependencies:
      - target: CalenEase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenjinliu.calenease.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: CalenEase

schemes:
  CalenEase:
    build:
      targets:
        CalenEase: all
        CalenEaseTests: [test]
        CalenEaseSnapshotTests: [test]
        CalenEaseUITests: [test]
    # 两份测试计划：Fast 是 PR 上跑的快线（逻辑 + 迁移 + 快照），Full 是全部（加上 UI 关键流程和无障碍审计）。
    # 计划里的 target ID 由 Scripts/sync-test-plans.py 在生成工程后填入。
    test:
      testPlans:
        - path: Full.xctestplan
          defaultPlan: true
        - path: Fast.xctestplan
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
