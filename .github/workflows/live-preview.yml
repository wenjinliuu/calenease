name: Live Preview

on:
  workflow_dispatch:
    inputs:
      preview_minutes:
        description: 预览开多久（1-20 分钟）
        type: number
        default: 12

permissions:
  contents: read

concurrency:
  group: live-preview
  cancel-in-progress: true

jobs:
  preview:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/live-preview.yml@be8dbb4ee3bc0b3a64e93dd5533d14c140dc5e95 # v1.0.0 候选（claude/continue-previous-task-8nvu6f）
    with:
      preview_minutes: ${{ inputs.preview_minutes }}
    secrets:
      AGENT_PREVIEW_PASSWORD: ${{ secrets.AGENT_PREVIEW_PASSWORD }}
      AGENT_PREVIEW_TUNNEL_TOKEN: ${{ secrets.AGENT_PREVIEW_TUNNEL_TOKEN }}
