name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank: GitHub run number)"
        type: string
        required: false
      lookup_only:
        description: "Only verify Apple registration; do not archive or upload"
        type: boolean
        default: false
      dry_run:
        description: "Unsigned archive only; never upload"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: calenease-testflight
  cancel-in-progress: false

jobs:
  release:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/testflight-release.yml@89da677e072827be1229167b285c7363c2294363
    with:
      workdir: ios
      project: CalenEase.xcodeproj
      scheme: CalenEase
      bundle_id: com.wenjinliu.calenease
      sync_command: bash Scripts/sync-app-icon.sh
      generate_command: xcodegen generate
      build_number: ${{ inputs.build_number || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      entitlements_path: CalenEase/Resources/CalenEase.entitlements
      entitlement_mode: icloud-verified
      icloud_container: iCloud.com.wenjinliu.calenease
      asc_verify_command: python3 Scripts/asc-verify.py
      lookup_only: ${{ inputs.lookup_only || false }}
      display_name: 省心日历
      artifact_prefix: calenease-
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
