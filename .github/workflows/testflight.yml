name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "构建号（留空则用 GitHub run number）"
        required: false
        type: string
      lookup_only:
        description: "只核对 App Store Connect 注册信息（列出 App / Bundle ID / SKU），不归档上传"
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  # 先用 App Store Connect API 只读核对：project.yml 里的 Bundle ID 已在 Apple Developer 注册、
  # App Store Connect 里已有对应 App、iCloud 能力已打开。缺一样都在这里失败，
  # 不用等到 macOS 上归档完、导出签名时才报「No profiles found」。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENABLE_ICLOUD: 'true'
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Verify App Store Connect registration
        run: |
          pip install --quiet 'pyjwt[crypto]'
          BUNDLE_ID=$(awk '/PRODUCT_BUNDLE_IDENTIFIER:/ {print $2; exit}' ios/project.yml)
          echo "project.yml 里的 Bundle ID：$BUNDLE_ID"
          if [ "${{ inputs.lookup_only }}" != "true" ]; then
            export EXPECTED_BUNDLE_ID="$BUNDLE_ID"
            if [ "$ENABLE_ICLOUD" = "true" ]; then export REQUIRED_CAPABILITIES=ICLOUD; fi
          fi
          python3 ios/Scripts/asc-verify.py

      - name: Clean up API key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8

  upload:
    needs: verify
    if: ${{ !inputs.lookup_only }}
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ios

    env:
      # iCloud 备份的开关，见下面「Embed entitlements into archive」那一步的说明。
      ENABLE_ICLOUD: 'true'
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Sync icon source artwork
        run: bash Scripts/sync-app-icon.sh

      - name: Write App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # xcodebuild 只认这个固定目录下的 AuthKey_<KEY_ID>.p8
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Generate project
        run: xcodegen generate
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}

      - name: Resolve build number
        id: build
        run: |
          NUMBER="${{ inputs.build_number }}"
          if [ -z "$NUMBER" ]; then NUMBER="${{ github.run_number }}"; fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      # 归档阶段不签名：带自动签名归档时 Xcode 会去申请「开发」描述文件，
      # 而开发描述文件需要团队里注册过设备。发布签名统一放到导出阶段，
      # 由 App Store Connect 密钥自动签发。
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ShiftLedger.xcodeproj \
            -scheme ShiftLedger \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ShiftLedger.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }} \
            | xcbeautify --renderer github-actions

      - name: Verify archived App Icon
        run: |
          APP_PATH=$(find build/ShiftLedger.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          find "$APP_PATH" -maxdepth 1 -type f -name 'AppIcon*.png' -print -quit | grep -q .

      # 把 entitlements 写进归档里的 App（iCloud 备份要用）。
      #
      # 归档是 CODE_SIGNING_ALLOWED=NO，Xcode 跳过了处理 entitlements 的那一步，
      # 归档出来的 App 身上一条 entitlement 都没有；而 -exportArchive 重新签名时
      # 取的正是「归档里 App 已有的 entitlements」。不补这一步，最终包里没有 iCloud 权限，
      # 真机上拿不到 iCloud 容器。「对个号」踩过这个坑，做法照搬：ad-hoc 签一次把
      # entitlements 写进去，导出时整个重签，只有 entitlements 会被继承下去。
      #
      # 前提是 Apple Developer 后台已经给 App ID com.wenjinliu.shiftledger 打开 iCloud 能力、
      # 建好并勾选容器 iCloud.com.wenjinliu.shiftledger。没开的话导出会报
      # 「Authentication failed / No profiles for 'com.wenjinliu.shiftledger' were found」——
      # CI 用的 App Store Connect 密钥能签发描述文件，但改不了 App ID 的能力。
      # 所以用 ENABLE_ICLOUD 开关控制：后台已配好（2026-09-23），现在是 'true'。
      # 关着时装出来的包没有 iCloud 权限，App 里的备份会自动落到本机，并提示原因。
      - name: Embed entitlements into archive
        if: env.ENABLE_ICLOUD == 'true'
        run: |
          set -e
          APP_PATH=$(find build/ShiftLedger.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          codesign --force --sign - \
            --entitlements ShiftLedger/Resources/ShiftLedger.entitlements \
            --generate-entitlement-der \
            "$APP_PATH"
          echo "=== 归档里的 entitlements ==="
          codesign -d --entitlements :- --xml "$APP_PATH" 2>/dev/null | plutil -convert xml1 -o - -

      - name: Write export options
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>upload</string>
          </dict>
          </plist>
          PLIST

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/ShiftLedger.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | xcbeautify --renderer github-actions

      - name: Upload dSYMs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsyms-${{ steps.build.outputs.number }}
          path: ios/build/ShiftLedger.xcarchive/dSYMs
          if-no-files-found: ignore

      - name: Clean up API key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
