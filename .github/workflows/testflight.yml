name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank: GitHub run number)"
        type: string
        required: false
      marketing_version:
        description: "Marketing version override (blank: project default)"
        type: string
        required: false
      lookup_only:
        description: "Only verify Apple registration; do not archive or upload"
        type: boolean
        default: false
      dry_run:
        description: "Unsigned archive only; never upload"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read    # 发版门槛读 Build & Test 的结果
  issues: write    # 开发版验收 Issue

concurrency:
  group: calenease-testflight
  cancel-in-progress: false

jobs:
  release:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/testflight-release.yml@49a2139dbae8314debb0ef4a171c717358e9b7bf
    with:
      workdir: ios
      project: CalenEase.xcodeproj
      scheme: CalenEase
      bundle_id: com.wenjinliu.calenease
      sync_command: bash Scripts/sync-app-icon.sh
      generate_command: xcodegen generate
      build_number: ${{ inputs.build_number || '' }}
      marketing_version: ${{ inputs.marketing_version || '' }}
      lookup_only: ${{ inputs.lookup_only || false }}
      dry_run: ${{ inputs.dry_run || false }}
      artifact_prefix: calenease-
      build_workflow: ios-build.yml
      acceptance_issue: true
      ci_revision: 49a2139dbae8314debb0ef4a171c717358e9b7bf
      display_name: 省心日历
      entitlements_path: CalenEase/Resources/CalenEase.entitlements
      entitlement_mode: icloud-verified
      icloud_container: iCloud.com.wenjinliu.calenease
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
