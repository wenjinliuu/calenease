name: App Icon Preview

on:
  push:
    branches: [main]
    paths:
      - "DesignAssets/AppIcon/**"
      - "ios/CalenEase/Resources/AppIcon.icon/**"
      - "ios/project.yml"
      - "ios/Scripts/sync-app-icon.sh"
      - ".github/workflows/icon-preview.yml"
  workflow_dispatch:

concurrency:
  group: app-icon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  icon:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/app-icon.yml@1041aed9c6c57d266ce19e40bc2ffc9dbf615a5a
    with:
      workdir: ios
      project: CalenEase.xcodeproj
      scheme: CalenEase
      icon_path: CalenEase/Resources/AppIcon.icon
      sync_command: bash Scripts/sync-app-icon.sh
      generate_command: xcodegen generate
