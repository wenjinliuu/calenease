name: Build & Test / Agent Preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simulator_name:
        description: "iPhone simulator model"
        type: string
        default: iPhone 17 Pro
      ios_runtime:
        description: "Installed iOS runtime (for example 26)"
        type: string
        default: '26'
      live_preview:
        description: "Open authenticated browser preview (requires AGENT_PREVIEW_PASSWORD secret)"
        type: boolean
        default: false
      capture_screenshots:
        description: "Run the App Store screenshot UI test scheme and publish artifacts"
        type: boolean
        default: false
      preview_minutes:
        description: "Live preview lifetime, 1-20 minutes"
        type: number
        default: 12

permissions:
  contents: write # Only the optional manual screenshots job pushes ci/screenshots; simulator job is read only.

concurrency:
  group: agent-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/agent-preview.yml@cb55a73d5436cad38f9f312c1fd39ace9f682ef9
    with:
      workdir: ios
      project: CalenEase.xcodeproj
      scheme: CalenEase
      bundle_id: com.wenjinliu.calenease
      sync_command: bash Scripts/sync-app-icon.sh
      generate_command: xcodegen generate
      simulator_name: ${{ inputs.simulator_name || 'iPhone 17 Pro' }}
      ios_runtime: ${{ inputs.ios_runtime || '26' }}
      live_preview: ${{ inputs.live_preview || false }}
      preview_minutes: ${{ fromJSON(format('{0}', inputs.preview_minutes || '12')) }}
      screenshot_scheme: CalenEaseScreenshots
      capture_screenshots: ${{ inputs.capture_screenshots || false }}
      screenshot_device: iPhone 17 Pro Max
      ci_revision: cb55a73d5436cad38f9f312c1fd39ace9f682ef9
    secrets:
      AGENT_PREVIEW_PASSWORD: ${{ secrets.AGENT_PREVIEW_PASSWORD }}
