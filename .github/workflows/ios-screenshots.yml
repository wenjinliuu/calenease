name: iOS Screenshots

# App Store 需要 6.9 英寸 iPhone 截图，这里在模拟器里跑一遍主要页面并导出，
# 顺带充当界面自查：产物在 Actions 的 artifact 里下载。
on:
  workflow_dispatch:
    inputs:
      device:
        description: "模拟器机型（留空自动挑最大的 Pro Max）"
        required: false
        type: string

concurrency:
  group: calenease-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Sync icon source artwork
        run: bash Scripts/sync-app-icon.sh

      - name: Generate project
        run: xcodegen generate

      # 优先挑 6.9 英寸的 Pro Max，挑不到再退回任意可用 iPhone
      - name: Pick simulator
        id: sim
        run: |
          NAME="${{ inputs.device }}"
          if [ -z "$NAME" ]; then
            NAME=$(xcrun simctl list devices available \
              | grep -oE "iPhone [0-9]+ Pro Max" | sort -V | tail -1)
          fi
          if [ -z "$NAME" ]; then
            NAME=$(xcrun simctl list devices available \
              | grep -oE "^ +iPhone [^(]+" | sed 's/^ *//;s/ *$//' | sort -V | tail -1)
          fi
          if [ -z "$NAME" ]; then echo "找不到可用的 iPhone 模拟器" >&2; exit 1; fi
          echo "使用模拟器：$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run screenshot UI tests
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild \
            -project CalenEase.xcodeproj \
            -scheme CalenEaseScreenshots \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath build/Screenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify --renderer github-actions

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments \
            --path build/Screenshots.xcresult \
            --output-path build/screenshots
          ls -R build/screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calenease-screenshots-${{ github.run_number }}
          path: ios/build/screenshots
          if-no-files-found: warn

      # artifact 只能在网页上下载，再推一份到 ci/screenshots 分支，
      # 方便直接 git fetch 取用。该分支每次覆盖，不并入 main。
      - name: Publish screenshots to ci/screenshots
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/ios/build/screenshots" 2>/dev/null)" ]; then
            echo "没有截图产物，跳过发布"
            exit 0
          fi
          rm -rf publish && mkdir publish && cd publish
          cp -R "$GITHUB_WORKSPACE/ios/build/screenshots/." .
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from run ${{ github.run_number }} (${{ github.sha }})"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/ci/screenshots
