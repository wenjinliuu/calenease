name: Probe holiday static hosting headers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      CLOUDBASE_ENV_ID: wenjin-cloudbase-d1empq882391ac1
      TCB_DISABLE_REPORT: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Upload temporary JSON and read public headers
        run: |
          npm install --global @cloudbase/cli@3.8.3
          tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" -e "$CLOUDBASE_ENV_ID" --yes
          trap 'tcb hosting delete holidays/v1/_probe.json --yes || true' EXIT
          printf '{"probe":true}\n' > /tmp/_probe.json
          tcb hosting deploy /tmp/_probe.json holidays/v1/_probe.json --yes
          curl --fail --silent --show-error -D - -o /dev/null -H 'Origin: https://example.org' 'https://wenjin-cloudbase-d1empq882391ac1-1311287495.tcloudbaseapp.com/holidays/v1/_probe.json'
